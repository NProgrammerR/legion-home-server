services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Helsinki
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.X:3000,localhost:3000
    restart: unless-stopped
