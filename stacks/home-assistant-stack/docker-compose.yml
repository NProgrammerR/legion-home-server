
services:
  # Home Assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ~/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Helsinki
    network_mode: host
    restart: unless-stopped
    # Docker's default is 10 s, too short for HA to close its SQLite DB cleanly.
    # Keep under docker.service's TimeoutStopSec (90 s) so host shutdown isn't cut short.
    stop_grace_period: 60s
    depends_on:
      - matter-server

  # Matter controller (IKEA DIRIGERA etc.), HA connects at ws://localhost:5580/ws
  # matterjs-server (successor of the archived python-matter-server) since 2026-11-25.
  # It migrated the python data files in ~/matter-server on first start. Runs as uid 1000.
  # Rollback: image ghcr.io/home-assistant-libs/python-matter-server:stable,
  #   command --storage-path /data, security_opt apparmor=unconfined (it keeps <id>.json current).
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:1.6.0
    command: --storage-path /data
    environment:
      - TZ=Europe/Helsinki
      - PRIMARY_INTERFACE=eno1
    cap_add:
      - NET_RAW   # device ping (host has net.ipv4.ping_group_range = 1 0)
    volumes:
      - ~/matter-server:/data
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s

  # 1. Speech-to-Text (Whisper)
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    command: --model small-int8 --language en
    volumes:
      - ~/whisper-data:/data
    environment:
      - TZ=Europe/Helsinki
    ports:
      - "10300:10300"
    restart: unless-stopped
