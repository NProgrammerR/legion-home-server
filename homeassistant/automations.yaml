- id: '1792226607540'
  alias: Vaccum
  description: ''
  triggers:
  - trigger: time
    at: '12:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  conditions:
  - condition: zone.not_in_zone
    target:
      entity_id:
      - person.owner
    options:
      behavior: any
      for:
        hours: 0
        minutes: 30
        seconds: 0
      zone: zone.home
  actions:
  - action: vacuum.start
    metadata: {}
    data: {}
    target:
      entity_id: vacuum.q5_pro
  - action: notify.send_message
    metadata: {}
    target:
      device_id: 43ef60332863e15b87646a89e4b313db
    data:
      message: Cleaning
  mode: single
